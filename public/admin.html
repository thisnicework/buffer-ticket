<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BUFFER 예매 관리</title>
<style>
:root{--paper:#EEF0F0;--ink:#0A0B0C;--mute:#5B6064;--line:#BFC3C6;--danger:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0A0B0C;--ink:#ECEEEE;--mute:#9AA0A4;--line:#2B2F32;--danger:#FF6F66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.mute{color:var(--mute);font-size:13px}
form,.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
input{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:8px 10px;min-width:260px;border-radius:0}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:8px 16px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
.tablewrap{overflow-x:auto;border-top:1px solid var(--ink)}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:500}
.del{border:0;color:var(--danger);text-decoration:underline;padding:0}
.del:hover{background:none;color:var(--danger)}
.sum{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0}
.err{color:var(--danger);min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <h1>BUFFER 버퍼 · 예매 관리</h1>
  <div class="mute">관리자 토큰으로만 열립니다. 토큰은 이 탭이 열려 있는 동안만 기억됩니다.</div>
  <form id="auth"><input id="token" type="password" placeholder="관리자 토큰" autocomplete="off"><button type="submit">불러오기</button></form>
  <div class="err" id="err" role="alert"></div>
  <div id="out" hidden>
    <div class="sum" id="sum"></div>
    <div class="tools"><button id="csv" type="button">CSV 내려받기</button><button id="reload" type="button">새로고침</button></div>
    <div class="tablewrap"><table><thead><tr><th>회차</th><th>예매번호</th><th>이름</th><th>전화번호</th><th>예매시각</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
(function(){
  var NAMES={A:"11.14 토 3PM",B:"11.14 토 7PM",C:"11.15 일 3PM",D:"11.15 일 7PM"};
  var token=""; try{token=sessionStorage.getItem("buf-admin")||""}catch(e){}
  var armed=null;
  function $(i){return document.getElementById(i)}
  function td(t){var c=document.createElement("td");c.textContent=t;return c}
  async function load(){
    $("err").textContent="";
    var r=await fetch("/api/admin/reservations",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
    if(r.status===401){$("out").hidden=true;$("err").textContent="토큰이 올바르지 않거나 서버에 관리자 토큰이 설정되어 있지 않습니다.";return}
    var d=await r.json(), rows=d.reservations; $("out").hidden=false;
    var cnt={A:0,B:0,C:0,D:0}; rows.forEach(function(x){cnt[x.show]++});
    $("sum").textContent=""; Object.keys(NAMES).forEach(function(k){var s=document.createElement("span");s.textContent=NAMES[k]+" : "+cnt[k]+" / 35";$("sum").appendChild(s)});
    var tb=$("rows"); tb.textContent="";
    rows.forEach(function(x){
      var tr=document.createElement("tr");
      tr.appendChild(td(NAMES[x.show])); tr.appendChild(td(x.code)); tr.appendChild(td(x.name)); tr.appendChild(td(x.phone)); tr.appendChild(td(new Date(x.createdAt).toLocaleString("ko-KR")));
      var c=document.createElement("td"), b=document.createElement("button"); b.className="del"; b.type="button"; b.textContent=armed===x.code?"한 번 더 누르면 삭제":"삭제";
      b.addEventListener("click",async function(){
        if(armed!==x.code){armed=x.code;load();return}
        await fetch("/api/admin/reservations/"+x.code,{method:"DELETE",headers:{Authorization:"Bearer "+token}}); armed=null; load();
      });
      c.appendChild(b); tr.appendChild(c); tb.appendChild(tr);
    });
  }
  $("auth").addEventListener("submit",function(e){e.preventDefault();token=$("token").value.trim();try{sessionStorage.setItem("buf-admin",token)}catch(x){} load()});
  $("reload").addEventListener("click",load);
  $("csv").addEventListener("click",async function(){
    var r=await fetch("/api/admin/reservations?format=csv",{headers:{Authorization:"Bearer "+token}}); if(!r.ok)return;
    var u=URL.createObjectURL(await r.blob()), a=document.createElement("a"); a.href=u; a.download="buffer-reservations.csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u)},1000);
  });
  if(token) load();
})();
</script>
</body>
</html>
